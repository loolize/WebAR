<!DOCTYPE html>
<html>
<head>
     <title>WebAR Практическая работа №2</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>


<body>

<a-scene 
    mindar-face>

    <a-assets>
        <a-asset-item
            id="glassesModel"
            src="models/deal_with_it_glasses_original.glb">
        </a-asset-item>
    </a-assets>


    <a-camera
        active="false"
        position="0 0 0">
    </a-camera>

    <a-entity
        mindar-face-target="anchorIndex: 168">

        <a-gltf-model
            src="#glassesModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="1 1 1">
        </a-gltf-model>

    </a-entity>

</a-scene>

</body>
</html>
